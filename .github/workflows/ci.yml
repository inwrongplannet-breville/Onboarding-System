name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Select the commits introduced by this event
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          else
            head="$PUSH_AFTER"
            if [[ -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != "$zero" ]] \
              && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              base="$PUSH_BEFORE"
            else
              git fetch --no-tags origin main
              base="$(git merge-base origin/main "$head")"

              # A new branch at an existing main commit has no new content.
              # For a force-push to main, however, origin/main already points
              # at head, so fall back to the first commit in the push payload.
              if [[ "$base" == "$head" ]]; then
                oldest="$(jq -r '.commits[0].id // empty' "$GITHUB_EVENT_PATH")"
                if [[ -z "$oldest" ]]; then
                  echo "scan=false" >> "$GITHUB_OUTPUT"
                  exit 0
                elif git cat-file -e "${oldest}^" 2>/dev/null; then
                  base="${oldest}^"
                else
                  echo "scan=true" >> "$GITHUB_OUTPUT"
                  echo "log_opts=${head}" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
            fi
          fi

          if [[ "$base" == "$head" ]]; then
            echo "scan=false" >> "$GITHUB_OUTPUT"
          else
            echo "scan=true" >> "$GITHUB_OUTPUT"
            echo "log_opts=${base}..${head}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan new commits with Gitleaks
        if: steps.range.outputs.scan == 'true'
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --redact=100 --ignore-gitleaks-allow --gitleaks-ignore-path=/dev/null \
            --log-opts="${{ steps.range.outputs.log_opts }}" /repo

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest

  sam-validation:
    name: SAM validation
    runs-on: ubuntu-latest
    env:
      SAM_CLI_TELEMETRY: '0'
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true
          token: ${{ github.token }}

      - name: Validate the SAM template
        run: sam validate --lint --region eu-north-1
