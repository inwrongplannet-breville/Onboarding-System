AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Employee Management & Onboarding System.
  One DynamoDB item per employee + six Lambdas behind API Gateway, wired to the UI.
  DELETE archives rather than erases - see src/handlers/delete_employee.py.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment stage. Names the API Gateway stage.
  AllowedOrigin:
    Type: String
    Default: http://localhost:8000
    Description: >
      The one browser origin allowed to call this API. Was '*', which let any
      page on the internet POST to /login and read the token back - a free
      password-guessing proxy through other people's browsers. Set this to
      wherever the UI is actually served from; '*' still works if you need it and
      accept that.

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256
    CodeUri: src/
    Environment:
      Variables:
        TABLE_NAME: !Ref OnboardingTable
        # Read by common/responses.py for the CORS header on every response.
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        # The `aud` claim tokens are minted for and checked against, so a dev
        # token is refused by a prod stack even if the two ever share a key.
        STAGE: !Ref Stage

Resources:

  # ---------------------------------------------------------------- data store
  #
  # One item per employee, keyed by employeeKey alone. The checklist is a list
  # attribute on that item, so there is nothing to sort within a partition and no
  # second kind of item to tell apart - the sort key this table used to carry is
  # gone.
  #
  # Still AWS::DynamoDB::Table rather than AWS::Serverless::SimpleTable, which
  # would now fit the key schema. SimpleTable exposes only PrimaryKey,
  # ProvisionedThroughput, SSESpecification, TableName and Tags: it cannot declare
  # PointInTimeRecovery or BillingMode, and it hides KeySchema, which in this repo
  # is documentation.
  #
  # No TableName. It used to be 'onboarding-${Stage}', and an explicit name is
  # exactly what makes a key-schema change undeployable: CloudFormation replaces a
  # resource by creating the new one before deleting the old, which cannot work
  # when the name is taken. Letting CloudFormation generate the name means the next
  # schema change is an ordinary deploy. Nothing reads the name as a literal -
  # Lambdas get it through TABLE_NAME and scripts/seed_employees.py resolves it
  # from the TableName output below.
  OnboardingTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      # Must match KEY_ATTRIBUTE in src/common/keys.py. Renaming it is a key-schema
      # change, which CloudFormation can only do by replacing the table - which is
      # why this resource deliberately has no TableName. See
      # docs/database-design.md#deploying-a-schema-change.
      AttributeDefinitions:
        - AttributeName: employeeKey
          AttributeType: S
      KeySchema:
        - AttributeName: employeeKey
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - Key: Project
          Value: onboarding-system

  # --------------------------------------------------------------- signing key
  #
  # Generated by CloudFormation, not passed in. Three things follow from that,
  # and all three were audit findings:
  #
  #   - The value never exists in a shell history, a CI log or a scrollback,
  #     because nobody ever types it.
  #   - It is not a Lambda environment variable any more. Environment variables
  #     come back in plaintext from lambda:GetFunctionConfiguration, so anyone
  #     holding that read-only-looking permission could previously read the
  #     signing key and mint an officials token for any user. Reading this needs
  #     secretsmanager:GetSecretValue on this one ARN, granted below to exactly
  #     two functions.
  #   - Revocation exists. There is no per-token denylist, so the lever for
  #     "invalidate everything now" is rotating this secret - one CLI call:
  #       aws secretsmanager put-secret-value --secret-id <arn> \
  #         --secret-string "$(py -c 'import secrets;print(secrets.token_urlsafe(48))')"
  #     Every token in circulation stops verifying within the authorizer cache
  #     window.
  #
  # GenerateSecretString runs on create only, so redeploying does not rotate the
  # key and does not sign everybody out.
  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: HMAC key for onboarding session tokens.
      GenerateSecretString:
        PasswordLength: 64
        # The key is base64-decoded by nobody - it is used as raw HMAC key
        # material - so punctuation buys nothing and only risks quoting
        # accidents for anyone who ever has to handle it.
        ExcludePunctuation: true

  # ------------------------------------------------------------------- the API
  OnboardingApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      # Phase 2 is curl-only, but the browser needs these the moment Phase 3
      # points the UI here. Cheaper to set now than to debug later.
      Cors:
        AllowOrigin: !Sub "'${AllowedOrigin}'"
        # Authorization joins Content-Type: every route except POST /login is
        # reached with a bearer token, and a preflight that does not list the
        # header fails the request before the real one is sent.
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"

      Auth:
        DefaultAuthorizer: TokenAuthorizer
        # The preflight must stay anonymous. A browser's OPTIONS request carries
        # no Authorization header by definition, so authorizing it means every
        # preflight 401s and the browser reports a CORS failure for a request the
        # user was perfectly entitled to make.
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          TokenAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            # REQUEST rather than TOKEN so the function reads the header itself
            # and can fold its case - see _bearer_token in handlers/authorizer.py.
            FunctionPayloadType: REQUEST
            Identity:
              Headers: [Authorization]
              # Sixty seconds, down from five minutes. The cache is keyed on
              # the token by the identity source above, so its window is also
              # the lag on every revocation: an expired token, or one killed by
              # rotating the secret, stays usable until the entry falls out.
              # Five minutes of that was more than this buys back - it still
              # collapses a burst of page-load requests into one invoke.
              ReauthorizeEvery: 60

      # Per-method throttling, and the only method that needs it is the one
      # anybody can call.
      #
      # Five per second, burst ten. Deliberately low, and the number comes from
      # arithmetic rather than taste: a login spends ~300ms in PBKDF2, so 5/s is
      # about 1.5 concurrent invocations - comfortably inside the 2 reserved for
      # LoginFunction below. Set it higher and the gateway lets through more than
      # Lambda will run, and load-shedding stops being a clean 429 and becomes a
      # 500 from a throttled invocation.
      #
      # Note what this is not: an API Gateway throttle is a stage-wide ceiling,
      # not per-IP, so it caps the damage and the bill rather than identifying an
      # attacker. Per-IP belongs to WAF, which is a cost decision, not a code one.
      MethodSettings:
        - ResourcePath: /login
          HttpMethod: POST
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10

      # API Gateway generates the 401 when the authorizer rejects a token, and a
      # gateway-generated response does not inherit the CORS headers the Lambdas
      # set in common/responses.py. Without these three, a browser sees an opaque
      # CORS error instead of the 401 - so an expired session looks like the API
      # is down, and js/store.js never gets the status it needs to sign out.
      GatewayResponses:
        UNAUTHORIZED:
          StatusCode: 401
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        ACCESS_DENIED:
          StatusCode: 403
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        # 5XX for the same reason, and it is not hypothetical. When Lambda
        # throttles - this account's concurrency ceiling is 10 - API Gateway
        # answers with its own 500 rather than the Lambda's, and that response
        # was arriving with no CORS headers at all. So a burst of load reached
        # the browser as an opaque CORS failure instead of a 500, which is the
        # same trap the 401 had and the same fix.
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  # ----------------------------------------------------------------- functions
  #
  # Six separate functions sharing one CodeUri. Separate so each gets its own
  # IAM role and its own CloudWatch log group; shared CodeUri so `common/` is
  # packaged into each one without a Lambda layer. Each zip is a few KB.
  #
  # IAM is written out inline rather than using SAM policy templates. The
  # templates are coarser than they look: DynamoDBReadPolicy grants
  # GetItem+Query+Scan+BatchGet, and DynamoDBWritePolicy grants no read actions
  # at all - so DeleteEmployeeFunction, which must read the checklist before it
  # stamps, would be pushed all the way up to full-CRUD.
  #
  # Query appears nowhere below any more. Reading an employee used to mean
  # querying a partition of nine rows; it is now a GetItem on one item.

  # The two auth functions. Neither touches DynamoDB, so neither has a policy at
  # all - a login route with table permissions is a login route that could read
  # the table if it were ever wrong. Both get JWT_SECRET, and they are the only
  # two that do: it is set per-function rather than in Globals so the six CRUD
  # Lambdas cannot sign a token even by accident.

  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.login.lambda_handler
      # Two of this account's ten concurrent executions, reserved.
      #
      # This is the fix for something the load probe turned up. Concurrency is an
      # account-wide pool shared by every function, and /login is the one route
      # that needs no credentials - so a burst against it could consume the whole
      # pool and leave the authenticated endpoints returning 500 for lack of an
      # execution slot. An unauthenticated denial of service against everything
      # else, from the one door that has to stay unlocked.
      #
      # Reserving cuts both ways on purpose: login can never take more than two,
      # and the other eight are never taken from it.
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          JWT_SECRET_ARN: !Ref JwtSecret
      Policies:
        - Version: '2012-10-17'
          Statement:
            # The signing key, and nothing else. No DynamoDB at all - a login
            # route that could read the employee table is a login route that
            # would, if it were ever wrong.
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref OnboardingApi
            Path: /login
            Method: POST
            # The one route with no authorizer, necessarily - it is where a token
            # comes from.
            Auth:
              Authorizer: NONE

  # No Api event. This function is invoked by API Gateway as the authorizer
  # declared on OnboardingApi above, not by a route, and SAM grants the
  # invoke permission as part of that wiring.
  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.authorizer.lambda_handler
      Environment:
        Variables:
          JWT_SECRET_ARN: !Ref JwtSecret
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret

  ListEmployeesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.list_employees.lambda_handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: dynamodb:Scan
              Resource: !GetAtt OnboardingTable.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref OnboardingApi
            Path: /employees
            Method: GET

  CreateEmployeeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.create_employee.lambda_handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            # One item, so one PutItem - no transaction to authorise against.
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt OnboardingTable.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref OnboardingApi
            Path: /employees
            Method: POST

  GetEmployeeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.get_employee.lambda_handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt OnboardingTable.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref OnboardingApi
            Path: /employees/{id}
            Method: GET

  UpdateEmployeeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.update_employee.lambda_handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            # GetItem as well as UpdateItem: the handler re-reads afterwards so
            # its response carries the checklist, matching GET exactly, and reads
            # again on a failed condition to tell 404 from 409. No PutItem or
            # DeleteItem - those were for moving the email uniqueness guard, and
            # with the guard gone an email is just another editable field.
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:GetItem
              Resource: !GetAtt OnboardingTable.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref OnboardingApi
            Path: /employees/{id}
            Method: PUT

  DeleteEmployeeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.delete_employee.lambda_handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            # No DeleteItem. DELETE archives the record rather than erasing it, so
            # this function reads the checklist to decide which terminal state to
            # stamp and then writes that one attribute. Removing DeleteItem is the
            # point: with it gone, a bug in this handler cannot destroy an employee
            # record even if it tries - and now that an employee is a single item,
            # one stray DeleteItem would take the checklist and its notes with it.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt OnboardingTable.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref OnboardingApi
            Path: /employees/{id}
            Method: DELETE

  SetChecklistItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.set_checklist_item.lambda_handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            # No ConditionCheckItem any more: the archive freeze used to be a
            # ConditionCheck against a sibling row inside a transaction, and is
            # now one more term in this write's own ConditionExpression. GetItem
            # covers both the failure path (telling an archived employee apart
            # from a missing one) and the consistent re-read that builds the
            # response.
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:GetItem
              Resource: !GetAtt OnboardingTable.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref OnboardingApi
            Path: /employees/{id}/checklist/{itemId}
            Method: PATCH

Outputs:
  ApiBaseUrl:
    Description: Base URL for the API. This is the value Phase 3 drops into js/store.js.
    Value: !Sub 'https://${OnboardingApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
  TableName:
    Description: DynamoDB table name.
    Value: !Ref OnboardingTable
  JwtSecretArn:
    Description: >
      Signing key for session tokens. Rotate it to invalidate every token in
      circulation - see the resource comment for the one-liner.
    Value: !Ref JwtSecret
